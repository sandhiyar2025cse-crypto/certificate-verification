<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify Certificate</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            color: #1f2937;
        }

        .topbar {
            height: 65px;
            background: linear-gradient(135deg, #0f2d5c, #174a8b);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
        }

        .nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
        }

        .main {
            max-width: 650px;
            margin: 55px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 9px;
            padding: 35px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .icon {
            width: 55px;
            height: 55px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #eaf2fb;
            color: #2563a8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: bold;
        }

        h1 {
            margin: 0 0 8px;
            color: #173b68;
            font-size: 26px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            height: 45px;
            padding: 10px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #2563a8;
            box-shadow: 0 0 0 3px rgba(37,99,168,0.12);
        }

        button {
            width: 100%;
            height: 45px;
            margin-top: 20px;
            border: none;
            border-radius: 5px;
            background: #2563a8;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4f89;
        }

        .hint {
            margin-top: 18px;
            padding: 14px;
            background: #f8fafc;
            border-left: 4px solid #2563a8;
            color: #64748b;
            font-size: 13px;
            line-height: 1.5;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563a8;
            text-decoration: none;
            font-size: 14px;
        }

    </style>

</head>

<body>

<div class="topbar">

    <div class="logo">
        Blockchain Certificate Platform
    </div>

    <div class="nav">
        <a href="/dashboard">Dashboard</a>
        <a href="/certificates">Certificates</a>
    </div>

</div>


<main class="main">

    <div class="card">

        <div class="header">

            <div class="icon">
                ✓
            </div>

            <h1>
                Verify Certificate
            </h1>

            <div class="subtitle">
                Verify the authenticity and integrity of a digital certificate.
            </div>

        </div>


        <form th:action="@{/verify}" method="post">

            <label>
                Certificate ID
            </label>

            <input type="text"
                   name="certificateId"
                   placeholder="Example: CERT-2026-001"
                   required>

            <button type="submit">
                Verify Certificate
            </button>

        </form>


        <div class="hint">
            The system will compare the certificate's current SHA-256
            hash with the hash stored in the blockchain ledger.
        </div>


        <a href="/dashboard" class="back">
            ← Back to Dashboard
        </a>

    </div>

</main>

</body>

</html>

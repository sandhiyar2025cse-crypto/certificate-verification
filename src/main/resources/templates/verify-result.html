<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verification Result</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            color: #1f2937;
        }

        .topbar {
            height: 65px;
            background: linear-gradient(135deg, #0f2d5c, #174a8b);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
        }

        .nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
        }

        .main {
            max-width: 850px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .result-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 9px;
            padding: 30px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .verified,
        .invalid {
            padding: 18px;
            border-radius: 7px;
            text-align: center;
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .verified {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .invalid {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .section-title {
            font-size: 18px;
            color: #173b68;
            font-weight: bold;
            margin: 25px 0 12px;
        }

        .details {
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            overflow: hidden;
        }

        .row {
            display: flex;
            padding: 13px 15px;
            border-bottom: 1px solid #edf0f3;
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            width: 190px;
            font-weight: bold;
            color: #4b5563;
            font-size: 13px;
        }

        .value {
            flex: 1;
            font-size: 13px;
        }

        .hash {
            word-break: break-all;
            font-family: monospace;
            font-size: 12px;
            color: #374151;
        }

        .blockchain {
            margin-top: 25px;
            padding: 20px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 7px;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            background: #eef5fc;
            color: #36516f;
            border-radius: 5px;
            font-size: 13px;
        }

        .buttons {
            text-align: center;
            margin-top: 25px;
        }

        .buttons a {
            display: inline-block;
            padding: 10px 18px;
            margin: 4px;
            border-radius: 5px;
            background: #2563a8;
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
        }

        .buttons a:hover {
            background: #1d4f89;
        }

    </style>

</head>

<body>

<div class="topbar">

    <div class="logo">
        Blockchain Certificate Platform
    </div>

    <div class="nav">
        <a href="/dashboard">Dashboard</a>
        <a href="/certificates">Certificates</a>
    </div>

</div>


<main class="main">

    <div class="result-card">

        <div th:if="${result.verified}"
             class="verified">
            ✓ CERTIFICATE VERIFIED
        </div>

        <div th:unless="${result.verified}"
             class="invalid">
            ✗ CERTIFICATE NOT VERIFIED
        </div>


        <div class="section-title">
            Certificate Details
        </div>

        <div class="details">

            <div class="row">

                <div class="label">
                    Certificate ID
                </div>

                <div class="value"
                     th:text="${result.certificateId}">
                </div>

            </div>


            <div th:if="${result.certificate != null}">

                <div class="row">

                    <div class="label">
                        Student Name
                    </div>

                    <div class="value"
                         th:text="${result.certificate.studentName}">
                    </div>

                </div>


                <div class="row">

                    <div class="label">
                        Course
                    </div>

                    <div class="value"
                         th:text="${result.certificate.courseName}">
                    </div>

                </div>


                <div class="row">

                    <div class="label">
                        Institution
                    </div>

                    <div class="value"
                         th:text="${result.certificate.institution}">
                    </div>

                </div>


                <div class="row">

                    <div class="label">
                        Issue Date
                    </div>

                    <div class="value"
                         th:text="${result.certificate.issueDate}">
                    </div>

                </div>


                <div class="row">

                    <div class="label">
                        Status
                    </div>

                    <div class="value"
                         th:text="${result.certificate.status}">
                    </div>

                </div>

            </div>

        </div>


        <div th:if="${result.block != null}"
             class="blockchain">

            <div class="section-title">
                Blockchain Verification
            </div>

            <div class="details">

                <div class="row">

                    <div class="label">
                        Block Index
                    </div>

                    <div class="value"
                         th:text="${result.block.blockIndex}">
                    </div>

                </div>


                <div class="row">

                    <div class="label">
                        Certificate Hash
                    </div>

                    <div class="value hash"
                         th:text="${result.block.certificateHash}">
                    </div>

                </div>


                <div class="row">

                    <div class="label">
                        Block Hash
                    </div>

                    <div class="value hash"
                         th:text="${result.block.blockHash}">
                    </div>

                </div>


                <div class="row">

                    <div class="label">
                        Previous Hash
                    </div>

                    <div class="value hash"
                         th:text="${result.block.previousHash}">
                    </div>

                </div>

            </div>


            <div class="message">

                <strong th:text="${result.message}">
                </strong>

            </div>

        </div>


        <div th:if="${result.block == null}"
             class="message">

            <strong th:text="${result.message}">
            </strong>

        </div>


        <div class="buttons">

            <a href="/verify">
                Verify Another
            </a>

            <a href="/dashboard">
                Dashboard
            </a>

        </div>

    </div>

</main>

</body>

</html>
